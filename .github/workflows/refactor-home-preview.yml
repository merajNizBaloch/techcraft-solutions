name: Apply home preview component refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract preview components from home page
        shell: python
        run: |
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')

          start_marker = '/* =========================================================\n   HERO PRODUCT PREVIEW\n========================================================= */'
          end_marker = '/* =========================================================\n   KEYBOARD PANEL\n========================================================= */'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Preview component markers not found')

          block = text[start:end]
          block = block.replace('/* =========================================================\n   HERO PRODUCT PREVIEW\n========================================================= */\n\n\n', '')

          component = '''"use client";\n\nimport { useEffect, useState } from "react";\n\n/* =========================================================\n   HERO PRODUCT PREVIEW\n========================================================= */\n\n''' + block + '''\nexport default function HomeProductPreview() {\n  return <ProductPreview />;\n}\n'''

          out = Path('app/components/home-product-preview.tsx')
          out.write_text(component, encoding='utf-8')

          replacement = '/* =========================================================\n   HERO PRODUCT PREVIEW\n========================================================= */\n\nimport HomeProductPreview from "./components/home-product-preview";\n'
          text = text[:start] + replacement + text[end:]
          text = text.replace('<ProductPreview />', '<HomeProductPreview />', 1)

          # ProductPreview's former local helper components are now owned by the extracted module.
          page.write_text(text, encoding='utf-8')

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/components/home-product-preview.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract home product preview'
          git push

name: Fix Explore CTA on working

on:
  push:
    branches:
      - working

permissions:
  contents: write

jobs:
  fix-explore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working
        uses: actions/checkout@v4
        with:
          ref: working
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Replace legacy Explore button in source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          page_path = Path('app/page.tsx')
          page = page_path.read_text()

          import_anchor = '} from "lucide-react";\nimport { useEffect, useRef, useState } from "react";'
          import_replacement = '} from "lucide-react";\nimport Link from "next/link";\nimport { useEffect, useRef, useState } from "react";'
          if 'import Link from "next/link";' not in page:
              if page.count(import_anchor) != 1:
                  raise SystemExit('Could not uniquely locate homepage import anchor')
              page = page.replace(import_anchor, import_replacement, 1)

          pattern = re.compile(
              r'<button\s+className="secondary-action"\s+onClick=\{\(\) => scrollTo\("work"\)\}\s*>\s*Explore work\s*<ArrowRight size=\{16\} />\s*</button>'
          )
          matches = list(pattern.finditer(page))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one legacy Explore button, found {len(matches)}')

          replacement = (
              '                <Link\n'
              '                  href="/portfolio"\n'
              '                  className="secondary-action"\n'
              '                  aria-label="Explore TechCraft portfolio"\n'
              '                >\n'
              '                  Explore work\n'
              '                  <ArrowRight size={16} aria-hidden="true" />\n'
              '                </Link>'
          )
          page = pattern.sub(replacement, page, count=1)
          page_path.write_text(page)

          layout_path = Path('app/layout.tsx')
          layout = layout_path.read_text()
          layout = layout.replace('import "./home-hero-explore-link.css";\n', '')
          layout = layout.replace('import HomeHeroExploreLink from "./components/home-hero-explore-link";\n', '')
          layout = layout.replace('        <HomeHeroExploreLink />\n', '')
          layout_path.write_text(layout)

          for path in [
              Path('app/components/home-hero-explore-link.tsx'),
              Path('app/home-hero-explore-link.css'),
          ]:
              if path.exists():
                  path.unlink()

          workflow = Path('.github/workflows/fix-explore-working.yml')
          if workflow.exists():
              workflow.unlink()

          final_page = page_path.read_text()
          hero_start = final_page.find('<div className="hero-buttons">')
          hero_end = final_page.find('<KeyboardHint />', hero_start)
          if hero_start < 0 or hero_end < 0:
              raise SystemExit('Could not locate hero action region after replacement')
          hero = final_page[hero_start:hero_end]
          if 'onClick={() => scrollTo("work")}' in hero:
              raise SystemExit('Legacy Explore click handler still exists in hero')
          if 'href="/portfolio"' not in hero:
              raise SystemExit('New portfolio link missing from hero')
          if re.search(r'<button\s+className="secondary-action"', hero):
              raise SystemExit('Legacy Explore button still exists in hero')
          if 'HomeHeroExploreLink' in layout:
              raise SystemExit('Temporary Explore portal still referenced by layout')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint baseline diagnostic
        continue-on-error: true
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached -- app/page.tsx app/layout.tsx
          git commit -m "fix: replace homepage Explore button with portfolio link"
          git push origin HEAD:working

name: Clean Explore CTA source on working

on:
  push:
    branches:
      - working

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working
        uses: actions/checkout@v4
        with:
          ref: working
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Clean source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          page_path = Path('app/page.tsx')
          page = page_path.read_text()
          old = '                                <Link\n                  href="/portfolio"'
          new = '                <Link\n                  href="/portfolio"'
          if page.count(old) != 1:
              raise SystemExit(f'Expected one over-indented Explore Link, found {page.count(old)}')
          page = page.replace(old, new, 1)
          page_path.write_text(page)

          workflow = Path('.github/workflows/cleanup-explore-working.yml')
          if workflow.exists():
              workflow.unlink()

          hero_start = page.find('<div className="hero-buttons">')
          hero_end = page.find('<KeyboardHint />', hero_start)
          hero = page[hero_start:hero_end]
          if hero_start < 0 or hero_end < 0:
              raise SystemExit('Hero action region not found')
          if '<Link\n                  href="/portfolio"' not in hero:
              raise SystemExit('Portfolio Link missing after cleanup')
          if 'onClick={() => scrollTo("work")}' in hero:
              raise SystemExit('Legacy Explore click handler returned')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Restore stable next-env declarations
        shell: bash
        run: |
          cat > next-env.d.ts <<'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />
          import "./.next/dev/types/routes.d.ts";
          import "./.next/dev/types/root-params.d.ts";

          // NOTE: This file should not be edited
          // see https://nextjs.org/docs/app/api-reference/config/typescript for more information.
          EOF

      - name: Commit clean validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: clean validated Explore CTA change"
          git push origin HEAD:working

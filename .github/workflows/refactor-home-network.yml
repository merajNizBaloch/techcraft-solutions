name: Apply home component refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract network canvas from home page
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { useEffect, useRef, useState } from "react";'
          new_import = 'import { useEffect, useState } from "react";\nimport HomeNetworkCanvas from "./components/home-network-canvas";'
          if old_import not in text:
              raise SystemExit('Expected React import not found')
          text = text.replace(old_import, new_import, 1)

          start_marker = 'function NetworkCanvas() {'
          end_marker = '/* =========================================================\n   BALOCHI-INSPIRED MICRO PATTERN\n========================================================= */'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('NetworkCanvas block markers not found')

          text = text[:start] + text[end:]
          text = text.replace('<NetworkCanvas />', '<HomeNetworkCanvas />', 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract home network canvas'
          git push

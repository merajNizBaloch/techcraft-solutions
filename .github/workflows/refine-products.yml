name: Refine homepage products

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[products-refined]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refine Products section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/page.tsx')
          text = path.read_text()

          new_projects = '''const projects = [
            {
              number: "01",
              category: "PRODUCT / EDUCATION",
              title: "Academiq",
              description:
                "A school operating system bringing students, teachers, attendance, fees, exams and reporting into one connected digital workspace.",
              mode: "blue",
            },
            {
              number: "02",
              category: "PRODUCT / DIGITAL PLATFORM",
              title: "Estara",
              description:
                "A focused digital product built around a clear experience, connected workflows and a foundation designed to evolve with its users.",
              mode: "light",
            },
          ];'''

          text, count = re.subn(
              r'const projects = \[.*?\n\];',
              new_projects,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not locate projects data block')

          text = text.replace('Selected work', 'Products')
          text = text.replace('>WORK<', '>PRODUCTS<')
          text = text.replace('/* =====================================================\n          WORK\n      ====================================================== */', '/* =====================================================\n          PRODUCTS\n      ====================================================== */')
          text = text.replace('<section id="work" className="work section">', '<section id="work" aria-label="Products" className="work products-section section">')

          marker = '<div className="work-list">'
          heading = '''<div className="products-heading">
            <div>
              <span className="section-kicker">05 / PRODUCTS</span>
              <h2>We build <span>products</span> too.</h2>
              <p>Our own digital products are where strategy, design and engineering come together to solve problems we understand deeply.</p>
            </div>
          </div>

          '''
          if marker in text and 'className="products-heading"' not in text:
              text = text.replace(marker, heading + marker, 1)

          path.write_text(text)

      - name: Commit refined homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Refine homepage Products section [products-refined]" || exit 0
          git push

      - name: Remove temporary workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/refine-products.yml || true
          git commit -m "Remove temporary products refinement workflow [products-refined]" || true
          git push || true
